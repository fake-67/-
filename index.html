<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat — Claude Opus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f10; color: #e8e8e8;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 20px; background: #1a1a1c;
    border-bottom: 1px solid #2a2a2c;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; flex-shrink: 0;
  }
  header .title { font-weight: 600; }
  header .model { color: #888; font-size: 12px; margin-left: 8px; }
  header button {
    background: #2a2a2c; color: #e8e8e8; border: none;
    padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    margin-left: 6px;
  }
  header button:hover { background: #3a3a3c; }

  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg {
    max-width: 820px; padding: 12px 16px; border-radius: 14px;
    line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
    font-size: 15px;
  }
  .user {
    align-self: flex-end; background: #2b6cff; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .ai {
    align-self: flex-start; background: #1e1e20;
    border: 1px solid #2a2a2c; border-bottom-left-radius: 4px;
  }
  .error { background: #3a1414 !important; border-color: #7a2020 !important; color: #ffb0b0 !important; }
  .msg img.attached {
    max-width: 320px; max-height: 320px; border-radius: 10px;
    margin-top: 8px; display: block; cursor: zoom-in;
  }
  .file-tag {
    display: inline-block; background: rgba(255,255,255,0.12);
    padding: 3px 9px; border-radius: 6px; font-size: 12px;
    margin-right: 6px; margin-top: 6px;
  }

  #attachments {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 0 20px; margin-bottom: 4px;
  }
  .att-chip {
    background: #2a2a2c; border: 1px solid #3a3a3c;
    padding: 6px 10px; border-radius: 8px; font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .att-chip img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; }
  .att-chip .rm { cursor: pointer; color: #ff8080; font-weight: bold; }

  footer {
    padding: 12px 20px 16px; background: #1a1a1c;
    border-top: 1px solid #2a2a2c; flex-shrink: 0;
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; background: #0f0f10; color: #e8e8e8;
    border: 1px solid #2a2a2c; border-radius: 10px;
    padding: 11px 14px; resize: none; font-family: inherit;
    font-size: 15px; max-height: 200px; outline: none;
  }
  textarea:focus { border-color: #2b6cff; }
  .icon-btn {
    background: #2a2a2c; color: #e8e8e8; border: none;
    width: 42px; height: 42px; border-radius: 10px;
    cursor: pointer; font-size: 18px; flex-shrink: 0;
  }
  .icon-btn:hover { background: #3a3a3c; }
  #send {
    background: #2b6cff; color: #fff; border: none;
    border-radius: 10px; padding: 0 22px; height: 42px;
    cursor: pointer; font-size: 15px; font-weight: 600; flex-shrink: 0;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing::after { content: "▋"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    display: none; align-items: center; justify-content: center; z-index: 100;
    cursor: zoom-out;
  }
  #lightbox img { max-width: 95%; max-height: 95%; }
</style>
</head>
<body>

<header>
  <div>
    <span class="title">💬 AI Chat</span>
    <span class="model">claude-opus-5</span>
  </div>
  <div>
    <button onclick="exportChat()">Скачать</button>
    <button onclick="clearChat()">Очистить</button>
  </div>
</header>

<div id="chat"></div>
<div id="attachments"></div>

<footer>
  <div class="input-row">
    <button class="icon-btn" id="fileBtn" title="Прикрепить файл">📎</button>
    <button class="icon-btn" id="imgBtn" title="Прикрепить изображение">🖼️</button>
    <textarea id="input" rows="1" placeholder="Сообщение... (Enter — отправить, Shift+Enter — перенос)"></textarea>
    <button id="send">➤</button>
  </div>
</footer>

<input type="file" id="fileInput" multiple style="display:none">
<input type="file" id="imgInput" accept="image/*" multiple style="display:none">
<div id="lightbox"><img id="lightboxImg"></div>

<script>
// ============ НАСТРОЙКИ ============
const API_URL = "https://tooken.club/v1/chat/completions";
const API_KEY = "tc_live_909d7ca0c30b5b960888192b2ad57711c5bb831e0a33308f";
const MODEL   = "claude-opus-5";
// ===================================

const chatEl      = document.getElementById("chat");
const inputEl     = document.getElementById("input");
const sendBtn     = document.getElementById("send");
const fileBtn     = document.getElementById("fileBtn");
const imgBtn      = document.getElementById("imgBtn");
const fileInput   = document.getElementById("fileInput");
const imgInput    = document.getElementById("imgInput");
const attEl       = document.getElementById("attachments");
const lightbox    = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

const SYSTEM_PROMPT = "Ты полезный ассистент. Отвечай на русском языке, если пользователь пишет по-русски. Будь точным и по делу.";

let messages    = loadHistory() || [{ role: "system", content: SYSTEM_PROMPT }];
let attachments = [];   // {type:'image'|'text', name, dataUrl?, text?}
let busy = false;

renderHistory();

// ---------- История ----------
function saveHistory() {
  try { localStorage.setItem("aichat_history", JSON.stringify(messages)); } catch(e){}
}
function loadHistory() {
  try {
    const s = localStorage.getItem("aichat_history");
    return s ? JSON.parse(s) : null;
  } catch(e) { return null; }
}
function renderHistory() {
  chatEl.innerHTML = "";
  for (const m of messages) {
    if (m.role === "system") continue;
    const isUser = m.role === "user";
    const div = document.createElement("div");
    div.className = "msg " + (isUser ? "user" : "ai");

    // если контент — массив частей (текст + картинки)
    if (Array.isArray(m.content)) {
      for (const part of m.content) {
        if (part.type === "text") {
          const t = document.createElement("div");
          t.textContent = part.text;
          div.appendChild(t);
        } else if (part.type === "image_url") {
          const img = document.createElement("img");
          img.className = "attached";
          img.src = part.image_url.url;
          img.onclick = () => showLightbox(part.image_url.url);
          div.appendChild(img);
        }
      }
    } else {
      div.textContent = m.content;
    }
    chatEl.appendChild(div);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}
function clearChat() {
  if (!confirm("Очистить всю историю?")) return;
  messages = [{ role: "system", content: SYSTEM_PROMPT }];
  saveHistory();
  renderHistory();
}
function exportChat() {
  const blob = new Blob([JSON.stringify(messages, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "chat-history.json";
  a.click();
}

// ---------- Сообщения ----------
function addMessageEl(content, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = content;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

// ---------- Attachments ----------
fileBtn.onclick = () => fileInput.click();
imgBtn.onclick  = () => imgInput.click();
fileInput.onchange = (e) => handleFiles(e.target.files, false);
imgInput.onchange  = (e) => handleFiles(e.target.files, true);

async function handleFiles(files, isImage) {
  for (const f of files) {
    if (f.size > 8 * 1024 * 1024) {
      alert("Файл " + f.name + " слишком большой (>8 МБ)");
      continue;
    }
    if (isImage || f.type.startsWith("image/")) {
      const dataUrl = await readAsDataURL(f);
      attachments.push({ type: "image", name: f.name, dataUrl });
    } else if (f.type === "application/pdf" || f.name.endsWith(".pdf")) {
      const text = await extractPdfText(f);
      attachments.push({ type: "text", name: f.name, text: "=== PDF: " + f.name + " ===\n" + text });
    } else {
      const text = await readAsText(f);
      attachments.push({ type: "text", name: f.name, text: "=== Файл: " + f.name + " ===\n" + text });
    }
  }
  renderAttachments();
  fileInput.value = ""; imgInput.value = "";
}

function readAsDataURL(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}
function readAsText(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsText(f);
  });
}
async function extractPdfText(f) {
  // Быстрое и грубое извлечение текста из PDF через pdf.js с CDN
  try {
    if (!window.pdfjsLib) {
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs", "module");
    }
    // Для mjs модулей делаем отдельную ветку через import()
    const pdfjsLib = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";
    const buf = await f.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      out += content.items.map(it => it.str).join(" ") + "\n\n";
    }
    return out.slice(0, 100000); // ограничение
  } catch (e) {
    return "(не удалось извлечь текст из PDF: " + e.message + ")";
  }
}
function loadScript(src, type) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; if (type) s.type = type;
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

function renderAttachments() {
  attEl.innerHTML = "";
  attachments.forEach((a, i) => {
    const chip = document.createElement("div");
    chip.className = "att-chip";
    if (a.type === "image") {
      chip.innerHTML = `<img src="${a.dataUrl}"><span>${a.name}</span><span class="rm" data-i="${i}">×</span>`;
    } else {
      chip.innerHTML = `<span>📄 ${a.name}</span><span class="rm" data-i="${i}">×</span>`;
    }
    attEl.appendChild(chip);
  });
  attEl.querySelectorAll(".rm").forEach(el => {
    el.onclick = () => {
      attachments.splice(+el.dataset.i, 1);
      renderAttachments();
    };
  });
}

// ---------- Отправка ----------
async function sendMessage() {
  if (busy) return;
  const text = inputEl.value.trim();
  if (!text && attachments.length === 0) return;

  // Собираем content
  let content;
  const textBlocks = [];
  if (text) textBlocks.push(text);
  for (const a of attachments) if (a.type === "text") textBlocks.push(a.text);

  const images = attachments.filter(a => a.type === "image");

  if (images.length === 0) {
    content = textBlocks.join("\n\n");
  } else {
    content = [];
    for (const t of textBlocks) content.push({ type: "text", text: t });
    for (const img of images) content.push({ type: "image_url", image_url: { url: img.dataUrl } });
  }

  const userMsg = { role: "user", content };
  messages.push(userMsg);
  saveHistory();

  // Отрисовка
  const userDiv = document.createElement("div");
  userDiv.className = "msg user";
  if (text) {
    const t = document.createElement("div"); t.textContent = text; userDiv.appendChild(t);
  }
  for (const a of attachments) {
    if (a.type === "text") {
      const tag = document.createElement("span");
      tag.className = "file-tag"; tag.textContent = "📄 " + a.name;
      userDiv.appendChild(tag);
    }
  }
  for (const img of images) {
    const im = document.createElement("img");
    im.className = "attached"; im.src = img.dataUrl;
    im.onclick = () => showLightbox(img.dataUrl);
    userDiv.appendChild(im);
  }
  chatEl.appendChild(userDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  inputEl.value = "";
  inputEl.style.height = "auto";
  attachments = [];
  renderAttachments();

  busy = true;
  sendBtn.disabled = true;

  const aiDiv = addMessageEl("", "ai typing");
  let answer = "";

  try {
    const resp = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({ model: MODEL, messages, stream: true })
    });

    if (!resp.ok) {
      const err = await resp.text();
      aiDiv.classList.remove("typing");
      aiDiv.classList.add("error");
      aiDiv.textContent = "Ошибка " + resp.status + ": " + err;
      busy = false; sendBtn.disabled = false;
      return;
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) continue;
        const data = trimmed.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) {
            answer += delta;
            aiDiv.classList.remove("typing");
            aiDiv.textContent = answer;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch(e){}
      }
    }

    if (!answer) aiDiv.textContent = "(пустой ответ)";
    messages.push({ role: "assistant", content: answer });
    saveHistory();

  } catch (e) {
    aiDiv.classList.remove("typing");
    aiDiv.classList.add("error");
    aiDiv.textContent = "Ошибка сети: " + e.message;
  }

  busy = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.onclick = sendMessage;
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
});

// Вставка изображений из буфера обмена
document.addEventListener("paste", (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const it of items) {
    if (it.type.startsWith("image/")) {
      const f = it.getAsFile();
      if (f) handleFiles([f], true);
    }
  }
});

// Drag-and-drop
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", async e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files];
  if (files.length) handleFiles(files, false);
});

// Lightbox
function showLightbox(src) {
  lightboxImg.src = src;
  lightbox.style.display = "flex";
}
lightbox.onclick = () => lightbox.style.display = "none";

inputEl.focus();
</script>
</body>
</html>
